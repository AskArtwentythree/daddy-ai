[project]
name = "loom-cli"
version = "0.5.1"
description = "LoomAI CLI: connects a computer's AI agents to the family gateway"
requires-python = ">=3.12"
dependencies = [
    "loom-common",
    "typer>=0.12",
    "httpx>=0.27",
    "websockets>=13",
    "mcp>=1.2",
]

[project.scripts]
loom = "loom_cli.main:app"
daddy = "loom_cli.main:app"  # the old name, so existing installs and habits keep working

[tool.uv.sources]
loom-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
