services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: daddy
      POSTGRES_PASSWORD: daddy
      POSTGRES_DB: daddy
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daddy -d daddy"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
